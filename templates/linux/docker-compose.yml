version: "3.9"

services:

  nginx:
    image: nginx:1.25-alpine
    container_name: tarea11_nginx
    restart: always
    ports:
      - "${NGINX_HOST_PORT}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - red_publica
    depends_on:
      - webapp
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  webapp:
    build:
      context: ./webapp
    container_name: tarea11_webapp
    restart: always
    networks:
      - red_publica
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/"]
      interval: 15s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:16-alpine
    container_name: tarea11_postgres
    restart: always
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - red_datos
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: tarea11_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL:    ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_LISTEN_PORT:      80
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - red_datos
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/misc/ping"]
      interval: 20s
      timeout: 10s
      retries: 3

networks:
  red_publica:
    driver: bridge
    name: tarea11_red_publica

  red_datos:
    driver: bridge
    name: tarea11_red_datos
    internal: true

volumes:
  postgres_data:
    name: tarea11_postgres_data
  pgadmin_data:
    name: tarea11_pgadmin_data